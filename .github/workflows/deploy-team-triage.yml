name: Deploy Team triage

# Ships https://mcbird.openclaw.ai after CI passes on a push to main.
# "Run workflow" redeploys the commit at the head of main after its CI passed.
# See deploy/team-triage/README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-team-triage
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  AWS_REGION: us-west-1
  AWS_ROLE_ARN: arn:aws:iam::631860342038:role/birdclaw-team-deploy
  RELEASE_BUCKET: birdclaw-team-releases-631860342038
  INSTANCE_ID: i-061b1847af5758622
  DO_NOT_TRACK: "1"

jobs:
  build:
    name: Build release
    # Only green CI runs from pushes to main in this repository, or a manual run on main.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Require the commit to be on main and green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          # Manual runs have no triggering CI run; require a successful CI push run for this commit.
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq '.total_count')
          [[ "$ok" -gt 0 ]] || { echo "no successful CI push run for $sha"; exit 1; }

      - name: Cache exact Bun canary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/bun
          key: bun-canary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains/bun-canary.conf') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Release metadata
        id: meta
        run: echo "release_id=main-$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        run: |
          deploy/team-triage/package-release.sh out
          echo "sha256=$(cat out/release.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: out/release.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to mcbird.openclaw.ai
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://mcbird.openclaw.ai
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate release metadata
        run: |
          [[ "$RELEASE_ID" =~ ^main-[0-9a-f]{12}$ ]] || { echo "invalid release id"; exit 1; }
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid sha256"; exit 1; }

      - name: Upload release to S3
        run: |
          echo "$RELEASE_SHA256  release.tgz" | sha256sum -c -
          aws s3 cp release.tgz "s3://$RELEASE_BUCKET/releases/$RELEASE_ID.tgz" --only-show-errors

      - name: Install on host via SSM
        run: |
          script=$(cat <<EOF
          set -euo pipefail
          tmp=\$(mktemp -d)
          trap 'rm -rf "\$tmp"' EXIT
          aws s3 cp "s3://$RELEASE_BUCKET/releases/$RELEASE_ID.tgz" "\$tmp/release.tgz" --only-show-errors --region $AWS_REGION
          echo "$RELEASE_SHA256  \$tmp/release.tgz" | sha256sum -c -
          tar -xzf "\$tmp/release.tgz" -C "\$tmp" ./deploy/team-triage/install-release.sh
          bash "\$tmp/deploy/team-triage/install-release.sh" "\$tmp/release.tgz" "$RELEASE_SHA256" "$RELEASE_ID"
          EOF
          )
          command="echo $(printf '%s' "$script" | base64 -w0) | base64 -d | bash"
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $RELEASE_ID" \
            --parameters "$(jq -nc --arg c "$command" '{commands:[$c], executionTimeout:["600"]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $id"
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          test "$status" = Success

      - name: Edge check (unauthenticated must be redirected to Access)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mcbird.openclaw.ai/)
          echo "unauthenticated status: $code"
          test "$code" = 302
